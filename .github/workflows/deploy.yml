name: Deploy to GitHub Pages

# Production = `main`, built at the site root. Always.
# Preview    = `integration/composeWeek`, built into /preview/ when that branch
#              exists (hotfix previews; storage suffix _preview).
# V2         = `v2`, built into /v2/ when that branch exists (the polish v2;
#              storage suffix _v2).
# V1         = the `v1-final` tag, built into /v1/ when the tag exists (the old
#              app as a fallback after the cutover; LIVE storage keys).
# All are best-effort: a failing preview build never blocks the production
# deploy — that preview is simply left out.
#
# This workflow always runs from `main` (push to main, or a manual/dispatched run
# on main — see preview-trigger.yml), so the branch can never alter how
# production is built or deployed.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  PREVIEW_BRANCH: integration/composeWeek
  V2_BRANCH: v2

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build

      # ---- preview (best-effort) -------------------------------------------
      - name: Check for preview branch
        id: preview
        run: |
          if git ls-remote --exit-code --heads origin "$PREVIEW_BRANCH" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "No $PREVIEW_BRANCH branch; skipping preview."
          fi
      - uses: actions/checkout@v4
        if: steps.preview.outputs.exists == 'true'
        continue-on-error: true
        with:
          ref: ${{ env.PREVIEW_BRANCH }}
          path: preview-src
      - name: Build preview into dist/preview
        if: steps.preview.outputs.exists == 'true'
        continue-on-error: true
        working-directory: preview-src
        run: |
          # Guard: the preview shares an origin (and so localStorage) with the
          # live app. Refuse to publish a preview build that doesn't isolate its
          # storage keys behind VITE_PREVIEW.
          grep -rq "VITE_PREVIEW" src/ || { echo "Preview does not isolate storage; refusing."; exit 1; }
          npm install
          VITE_PREVIEW=1 npm run build -- --outDir ../preview-dist
          mv ../preview-dist ../dist/preview

      # ---- v2 (best-effort) ------------------------------------------------
      - name: Check for v2 branch
        id: v2
        run: |
          if git ls-remote --exit-code --heads origin "$V2_BRANCH" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "No $V2_BRANCH branch; skipping v2."
          fi
      - uses: actions/checkout@v4
        if: steps.v2.outputs.exists == 'true'
        continue-on-error: true
        with:
          ref: ${{ env.V2_BRANCH }}
          path: v2-src
      - name: Build v2 into dist/v2
        if: steps.v2.outputs.exists == 'true'
        continue-on-error: true
        working-directory: v2-src
        run: |
          # Same guard as the preview: v2 shares the origin, so it must keep its
          # storage behind its own suffix (VITE_PREVIEW=v2 -> _v2).
          grep -rqF 'VITE_PREVIEW === "v2"' src/ || { echo "v2 does not isolate storage; refusing."; exit 1; }
          npm install
          VITE_PREVIEW=v2 npm run build -- --outDir ../v2-dist
          mv ../v2-dist ../dist/v2

      # ---- v1 fallback (best-effort) --------------------------------------
      # After the polish cutover the old app stays reachable at /v1/ for a few
      # weeks: the `v1-final` tag, built with VITE_LEGACY=1 (an "Old version"
      # banner). Unlike the previews it deliberately uses the LIVE storage keys,
      # so it opens on real data. Delete the tag to retire it.
      - name: Check for v1-final tag
        id: v1
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v1-final" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "No v1-final tag; skipping /v1/."
          fi
      - uses: actions/checkout@v4
        if: steps.v1.outputs.exists == 'true'
        continue-on-error: true
        with:
          ref: v1-final
          path: v1-src
      - name: Build v1 fallback into dist/v1
        if: steps.v1.outputs.exists == 'true'
        continue-on-error: true
        working-directory: v1-src
        run: |
          # Guard: the fallback must say it's the old version.
          grep -rqF 'VITE_LEGACY' src/ || { echo "v1-final has no fallback banner; refusing."; exit 1; }
          npm install
          VITE_LEGACY=1 npm run build -- --outDir ../v1-dist
          mv ../v1-dist ../dist/v1

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
